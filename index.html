<!DOCTYPE html>
<html lang="sl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zdrav</title>
  <meta name="description" content="Baza zdravih obrokov — dodajaj recepte in naključno izberi obrok, ko zmanjka idej za zajtrk, kosilo ali večerjo." />
  <meta name="theme-color" content="#0d1410" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Zdrav" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css" />
  <script>
    // Uveljavi shranjeno temo se pred izrisom, da ne utripne.
    try {
      var t = localStorage.getItem("zdrav-theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <button id="themeToggle" class="theme-toggle" type="button" title="Svetla / temna tema" aria-label="Preklopi svetlo ali temno temo">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
    </svg>
  </button>

  <button id="hardResetBtn" class="hard-reset-btn" type="button" title="Trdo osveži (Ctrl+F5)" aria-label="Trdo osveži aplikacijo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/>
    </svg>
  </button>

  <!-- ============ Prijavni zaslon ============ -->
  <section class="auth-screen" id="authScreen" hidden>
    <div class="auth-card">
      <span class="brand-icon auth-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor">
          <circle cx="12" cy="9.8" r="4"/>
          <circle cx="12" cy="15.3" r="7"/>
          <path d="M12 5.8 L12 3.2" stroke-width="1.4" stroke-linecap="round"/>
          <path d="M12 4.1 Q14.2 2.4 15.7 3 Q14.8 5.3 12 4.1 Z" stroke="none"/>
        </svg>
      </span>
      <h1 class="auth-brand">Zdrav</h1>
      <p class="auth-sub" id="authTitle">Prijava</p>

      <form id="authForm" autocomplete="on">
        <label class="field-label" for="authEmail">E-pošta</label>
        <input id="authEmail" class="field-input" type="email" autocomplete="email" required />

        <label class="field-label" for="authPassword">Geslo</label>
        <input id="authPassword" class="field-input" type="password" autocomplete="current-password" minlength="6" required />

        <button id="authForgot" class="auth-forgot" type="button">Pozabljeno geslo?</button>

        <p class="auth-error" id="authError" role="alert"></p>
        <p class="auth-note" id="authNote"></p>

        <button id="authSubmit" class="tool-btn primary auth-submit" type="submit">Prijava</button>
      </form>

      <button id="authToggle" class="auth-toggle" type="button">Nimaš računa? Registracija</button>
    </div>
  </section>

  <!-- ============ Zaslon: novo geslo (po povezavi iz e-pošte) ============ -->
  <section class="auth-screen" id="recoveryScreen" hidden>
    <div class="auth-card">
      <span class="brand-icon auth-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor">
          <circle cx="12" cy="9.8" r="4"/>
          <circle cx="12" cy="15.3" r="7"/>
          <path d="M12 5.8 L12 3.2" stroke-width="1.4" stroke-linecap="round"/>
          <path d="M12 4.1 Q14.2 2.4 15.7 3 Q14.8 5.3 12 4.1 Z" stroke="none"/>
        </svg>
      </span>
      <h1 class="auth-brand">Zdrav</h1>
      <p class="auth-sub">Nastavi novo geslo</p>

      <form id="recoveryForm" autocomplete="on">
        <label class="field-label" for="recoveryPassword">Novo geslo</label>
        <input id="recoveryPassword" class="field-input" type="password" autocomplete="new-password" minlength="6" required />

        <label class="field-label" for="recoveryPassword2">Ponovi geslo</label>
        <input id="recoveryPassword2" class="field-input" type="password" autocomplete="new-password" minlength="6" required />

        <p class="auth-error" id="recoveryError" role="alert"></p>
        <p class="auth-note" id="recoveryNote"></p>

        <button id="recoverySubmit" class="tool-btn primary auth-submit" type="submit">Shrani geslo</button>
      </form>
    </div>
  </section>

  <!-- ============ Aplikacija (vidna po prijavi) ============ -->
  <div id="appRoot" hidden>
  <div class="user-bar">
    <span id="userEmail" class="user-email"></span>
    <button id="signoutBtn" class="signout-btn" type="button">Odjava</button>
  </div>

  <header class="hero">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor">
          <circle cx="12" cy="9.8" r="4"/>
          <circle cx="12" cy="15.3" r="7"/>
          <path d="M12 5.8 L12 3.2" stroke-width="1.4" stroke-linecap="round"/>
          <path d="M12 4.1 Q14.2 2.4 15.7 3 Q14.8 5.3 12 4.1 Z" stroke="none"/>
        </svg>
      </span>
      <div class="brand-text">
        <h1>Zdrav</h1>
        <p class="tag">Baza zdravih obrokov</p>
      </div>
    </div>

    <button id="randomBtn" class="random-btn" type="button">
      <span aria-hidden="true">🎲</span> Jedi kupus brate
    </button>
  </header>

  <nav class="tabs" id="tabs" aria-label="Kategorije obrokov"></nav>

  <main class="panel">
    <div class="panel-head">
      <h2 id="panelTitle"></h2>
      <button id="addMealBtn" class="add-btn" type="button">+ Dodaj obrok</button>
    </div>

    <div class="meals-grid" id="mealsGrid"></div>
  </main>
  </div>

  <!-- ============ MODAL: dodaj obrok ============ -->
  <div class="modal-overlay" id="addOverlay" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <h2 class="modal-title" id="addModalTitle">Nov obrok</h2>

      <label class="field-label">Kategorija</label>
      <select id="addCategory" class="field-input"></select>

      <label class="field-label">Ime obroka</label>
      <input id="addName" class="field-input" type="text" placeholder="npr. Ovsena kaša z jagodami" autocomplete="off" />

      <label class="field-label">Sestavine</label>
      <textarea id="addIngredients" class="field-input field-textarea" placeholder="Ena sestavina na vrstico ali kratek opis…"></textarea>

      <label class="field-label">Slika</label>
      <div class="image-pick">
        <img id="addPreview" class="image-preview" hidden alt="" />
        <label class="image-btn">
          📷 Izberi sliko
          <input id="addImageFile" type="file" accept="image/*" hidden />
        </label>
      </div>

      <div class="modal-actions">
        <button id="addCancel" class="tool-btn" type="button">Prekliči</button>
        <button id="addConfirm" class="tool-btn primary" type="button">Shrani obrok</button>
      </div>

      <button id="addDelete" class="tool-btn danger-full" type="button" hidden>🗑 Izbriši obrok</button>
    </div>
  </div>

  <!-- ============ MODAL: naključni izbor ============ -->
  <div class="modal-overlay" id="randomOverlay" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <button class="modal-close" id="randomClose" type="button" aria-label="Zapri">✕</button>

      <!-- korak 1: izbira kategorije -->
      <div id="randomPickStep">
        <h2 class="modal-title">Katero kategorijo?</h2>
        <div class="cat-pick-grid" id="catPickGrid"></div>
        <div class="modal-actions">
          <button id="randomConfirm" class="tool-btn primary" type="button" disabled>Potrdi</button>
        </div>
      </div>

      <!-- korak 2: rezultat -->
      <div id="randomResultStep" hidden>
        <div id="randomResultBody"></div>
        <div class="modal-actions">
          <button id="randomBack" class="tool-btn" type="button">← Nazaj</button>
          <button id="randomReroll" class="tool-btn primary" type="button">🎲 Znova</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
